name: Build Exact OCR APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download original APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download exact-ocr-base --repo "$GITHUB_REPOSITORY" --pattern "base.apk" -D input
          ls -lh input/base.apk

      - name: Download apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          java -jar apktool.jar --version

      - name: Decode APK
        run: |
          rm -rf work
          java -jar apktool.jar d -f input/base.apk -o work

      - name: Patch package permission provider conflict
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          orig = "com.devil.winnerstudio"
          new = "com.manualcodex.winnerstudio.exactocr"
          work = Path("work")
          mfile = work / "AndroidManifest.xml"
          m = mfile.read_text(errors="ignore")

          # ขยาย .MainActivity/.xxx ให้เป็น class เดิมก่อนเปลี่ยน manifest package
          m = re.sub(r'(android:name=")\.([^"]+)"', r'\1' + orig + r'.\2"', m)

          # เปลี่ยน package หลัก
          if re.search(r'<manifest[^>]*\bpackage="[^"]+"', m):
              m = re.sub(r'(<manifest[^>]*\bpackage=")[^"]+(")', r'\1' + new + r'\2', m, count=1)
          else:
              m = re.sub(r'<manifest\b', '<manifest package="' + new + '"', m, count=1)

          # แก้ custom permission ที่ชน original
          m = m.replace(orig + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION", new + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
          m = m.replace(orig + ".permission", new + ".permission")

          # แก้ provider authorities ที่ชน original แต่ไม่เปลี่ยน class name
          def fix_authorities(match):
              val = match.group(2)
              val = val.replace(orig, new)
              return match.group(1) + val + match.group(3)

          m = re.sub(r'(android:authorities=")([^"]+)(")', fix_authorities, m)

          mfile.write_text(m)

          # แก้ authorities/permission ใน XML อื่น ๆ เผื่อมี provider paths หรือ string ref
          for p in list((work / "res").rglob("*.xml")):
              s = p.read_text(errors="ignore")
              s2 = s
              s2 = s2.replace(orig + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION", new + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
              s2 = s2.replace(orig + ".fileprovider", new + ".fileprovider")
              s2 = s2.replace(orig + ".provider", new + ".provider")
              s2 = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1Winner Exact OCR\2', s2)
              if s2 != s:
                  p.write_text(s2)

          print("patched package:", new)
          print("manifest conflict strings left:")
          left = [x for x in [orig + ".DYNAMIC_RECEIVER", orig + ".fileprovider", orig + ".provider"] if x in mfile.read_text(errors="ignore")]
          print(left)
          PY

      - name: Verify patched manifest
        run: |
          echo "=== MANIFEST PACKAGE / PROVIDER / PERMISSION ==="
          grep -nE "package=|provider|authorities|DYNAMIC_RECEIVER|permission" work/AndroidManifest.xml | head -120 || true
          echo "=== OCR files ==="
          test -f work/lib/arm64-v8a/libppocrv5ncnn.so
          test -f work/lib/arm64-v8a/libtesseract.so
          test -f work/assets/tessdata/tha.traineddata
          test -f work/assets/PP_OCRv5_mobile_det.ncnn.bin
          test -f work/assets/PP_OCRv5_mobile_rec.ncnn.bin
          echo "OCR files OK"

      - name: Build APK
        run: |
          rm -rf unsigned signed
          mkdir -p unsigned signed
          java -jar apktool.jar b work -o unsigned/winner-exact-ocr-debug.unsigned.apk
          ls -lh unsigned/

      - name: Sign APK
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out signed/winner-exact-ocr-debug.apk \
            unsigned/winner-exact-ocr-debug.unsigned.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging signed/winner-exact-ocr-debug.apk | head -20
          ls -lh signed/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winner-exact-ocr-debug
          path: signed/winner-exact-ocr-debug.apk
