<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔥 Hero Image Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#ffffff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:28px 16px;
}
.card{
  width:min(680px,100%);
  margin:0 auto;
  background:#15161d;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  padding:26px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
.hero{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.14);
  margin-bottom:20px;
  display:block;
}
h1{
  margin:0 0 18px;
  font-size:42px;
  line-height:1.08;
  color:#55ff00;
}
.badge{
  display:inline-block;
  background:#55ff00;
  color:#050505;
  padding:12px 22px;
  border-radius:999px;
  font-weight:900;
  margin:6px 0 20px;
}
p{
  font-size:20px;
  line-height:1.55;
  opacity:.92;
}
button{
  border:0;
  border-radius:20px;
  padding:16px 24px;
  font-size:20px;
  font-weight:900;
  background:#ffd66b;
  margin-top:12px;
}
#log,.section{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:#050505;
  border:1px solid rgba(255,255,255,.16);
}
.section h3{
  margin:0 0 8px;
  color:#55ff00;
  font-size:24px;
}
.section p{
  margin:0;
}
</style>
</head>
<body>
  <div class="card">
    <img class="hero" src="assets/1000090317.png" alt="🔥 Hero Image Test">
    <h1>🔥 Hero Image Test</h1>
    <div class="badge">HTML TEST MODE</div>
    <p>ทดสอบรูปจาก assets ใน HTML ก่อน Build APK</p>

    
      <div class="section">
        <h3>Section 1</h3>
        <p>อันนี้สร้างจาก JSON และแสดงรูป heroImage ได้แล้ว</p>
      </div>

    <button onclick="tick()">กดทดสอบ</button>
    <div id="log">สถานะ: พร้อมทดสอบ</div>
  </div>

<script>
let n = 0;
function tick(){
  n++;
  document.getElementById('log').textContent =
    'สถานะ: ปุ่มทำงานแล้ว ✅ จำนวนครั้ง: ' + n + ' เวลา: ' + new Date().toLocaleString('th-TH');
}
</script>
</body>
</html>
