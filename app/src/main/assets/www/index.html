<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual Codex APK</title>
<style>
body{margin:0;background:#050507;color:white;font-family:system-ui;padding:24px}
.card{background:#15151c;border:1px solid #333;border-radius:26px;padding:22px}
h1{color:#65ff00;font-size:38px}
button{background:#ffd36a;border:0;border-radius:18px;padding:16px 20px;font-weight:900;font-size:18px}
.log{margin-top:16px;background:#000;border-radius:16px;padding:16px}
</style>
</head>
<body>
<div class="card">
<h1>🟢 GitHub APK Build</h1>
<p>ถ้าเห็นหน้านี้ แปลว่า GitHub Actions build APK สำเร็จ</p>
<button onclick="test()">ทดสอบปุ่ม</button>
<div class="log" id="log">พร้อม</div>
</div>
<script>
let n=0;
function test(){
  n++;
  document.getElementById('log').textContent='ปุ่มทำงานแล้ว ✅ ครั้งที่ '+n+' เวลา '+new Date().toLocaleString('th-TH');
}
</script>
</body>
</html>
