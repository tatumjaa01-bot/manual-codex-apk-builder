<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Manual Codex Lite</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.card{
  width:min(520px,100%);
  background:#15161d;
  border:1px solid #30313a;
  border-radius:28px;
  padding:26px;
  text-align:center;
}
h1{font-size:34px;margin:0 0 12px;color:#55ff00}
p{font-size:18px;line-height:1.5;opacity:.85}
button{
  border:0;
  border-radius:20px;
  padding:16px 22px;
  font-size:20px;
  font-weight:900;
  margin-top:12px;
  background:#55ff00;
  color:#050505;
}
.small{font-size:14px;opacity:.65;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>Manual Codex Lite</h1>
  <p>เปิด Codex Lite แบบ APK</p>
  <button onclick="openLite()">Open Codex Lite 🚀</button>
  <p class="small">
    ต้องเปิด server ใน Termux ไว้ก่อน:<br>
    cd ~/manual_codex_lite && npm start
  </p>
</div>

<script>
function openLite(){
  location.href = 'http://127.0.0.1:8787/';
}
setTimeout(openLite, 800);
</script>
</body>
</html>
